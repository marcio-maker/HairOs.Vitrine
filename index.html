<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<meta name="description" content="Escolha o corte perfeito com fotos de frente, lado e atrás. Kits de produtos recomendados para manter o resultado em casa. Links de afiliado.">
<title>HairOS · Cortes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2309090a'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='72' fill='%23c9a96e' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#09090a;
    --ink-2:#131315;
    --ink-3:#1c1c1f;
    --line:rgba(201,169,110,.28);
    --gold:#c9a96e;
    --gold-hi:#f1dca6;
    --gold-lo:#8a6a33;
    --gold-grad:linear-gradient(145deg,var(--gold-hi),var(--gold) 48%,var(--gold-lo));
    --text:#ece7dd;
    --muted:#a29b8d;
    --serif:"Playfair Display","Didot","Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-padding-top:var(--safe-t)}
  body{
    min-height:100vh;color:var(--text);font:400 16px/1.55 var(--sans);
    background:
      radial-gradient(90% 50% at 50% 0%,#2a2a2e 0%,transparent 70%),
      var(--ink);
    padding:calc(var(--safe-t) + 28px) 18px calc(var(--safe-b) + 120px);
  }
  body.lock{overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

  .wrap{max-width:980px;margin:0 auto}

  /* ---------- Topo ---------- */
  header{display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{
    width:76px;height:76px;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(160deg,#252528,#050506);
    border:1px solid rgba(241,220,166,.55);
    box-shadow:0 0 22px rgba(201,169,110,.55),0 0 2px rgba(255,236,190,.9),inset 0 0 14px rgba(201,169,110,.12);
  }
  .logo span{
    font:600 48px/1 var(--serif);
    background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 5px rgba(201,169,110,.5));
  }
  h1{margin-top:20px;font:600 clamp(28px,6vw,40px)/1.15 var(--serif);letter-spacing:.01em}
  .lead{margin-top:10px;max-width:46ch;color:var(--muted);font-size:15px}

  .chips{margin:28px 0 22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);font-size:14px;transition:all .2s ease;
  }
  .chip:hover{color:var(--text);border-color:var(--gold)}
  .chip[aria-pressed="true"]{background:var(--gold-grad);color:#1a1307;border-color:transparent;font-weight:600}

  /* ---------- Grade ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}

  .card{
    all:unset;box-sizing:border-box;position:relative;display:block;cursor:pointer;
    padding:2px;border-radius:24px;background:var(--gold-grad);
    box-shadow:0 0 16px rgba(201,169,110,.32);
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .card:hover{
    transform:translateY(-5px);
    box-shadow:
      0 0 22px rgba(241,220,166,.55),
      0 0 44px rgba(201,169,110,.28),
      0 18px 32px rgba(0,0,0,.55);
  }
  .card:focus-visible{outline:2px solid #fff;outline-offset:4px}
  .card .photo{display:block;border-radius:22px;overflow:hidden;aspect-ratio:1/1.15;background:#2a2622;position:relative}
  .card .photo svg,.card .photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
  .card .cap{
    position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;
    background:linear-gradient(180deg,transparent,rgba(5,5,6,.82));
    font:600 16px/1.2 var(--serif);color:#fff;text-align:left;
  }
  .card .cap small{display:block;margin-top:3px;font:400 12px/1.3 var(--sans);color:#d9d2c3}
  .heart{
    position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;background:rgba(9,9,10,.6);backdrop-filter:blur(6px);
    border:1px solid var(--line);
  }
  .heart svg{width:17px;height:17px;fill:none;stroke:var(--gold-hi);stroke-width:1.8;transition:all .2s}
  .heart.on svg{fill:var(--gold);stroke:var(--gold)}

  .empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted)}
  .empty b{display:block;font:600 22px var(--serif);color:var(--text);margin-bottom:8px}

  @media (prefers-reduced-motion:no-preference){
    .logo{animation:ignite 1.1s ease-out both}
    .card{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.35s + var(--i) * 70ms)}
    @keyframes ignite{0%{box-shadow:0 0 0 rgba(201,169,110,0);opacity:0}100%{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  }

  /* ---------- Navegação em pílulas ---------- */
  nav{
    position:fixed;left:50%;bottom:calc(var(--safe-b) + 18px);transform:translateX(-50%);z-index:20;
    display:flex;gap:10px;padding:8px;border-radius:999px;
    background:rgba(14,14,16,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.55);
    transition:transform .35s ease;
  }
  nav.hide{transform:translateX(-50%) translateY(calc(100% + 30px))}
  .pill{
    min-width:112px;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;
    color:var(--gold-hi);border:1px solid var(--line);transition:all .2s ease;
  }
  .pill[aria-pressed="true"]{
    background:linear-gradient(180deg,#f3dba0,#c9994a 60%,#b0802f);color:#1a1307;border-color:transparent;
    box-shadow:0 0 16px rgba(201,169,110,.5),inset 0 1px 0 rgba(255,255,255,.5);
  }

  /* ---------- Painel de detalhe ---------- */
  .veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .25s ease}
  .veil.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;z-index:50;left:50%;bottom:0;width:min(560px,100%);max-height:92vh;
    transform:translate(-50%,105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
    background:var(--ink-2);border:1px solid var(--line);border-bottom:0;
    border-radius:28px 28px 0 0;overflow:auto;overscroll-behavior:contain;
  }
  .sheet.open{transform:translate(-50%,0)}
  @media (min-width:700px){
    .sheet{bottom:auto;top:50%;border-radius:28px;border-bottom:1px solid var(--line);transform:translate(-50%,-40%);opacity:0;pointer-events:none;transition:all .3s ease}
    .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  }
  .sheet .hero{position:relative;aspect-ratio:16/11;overflow:hidden;background:#2a2622;cursor:zoom-in}
  .sheet .hero .photo{display:block;width:100%;height:100%}
  .sheet .hero svg,.sheet .hero img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:opacity .25s ease,transform .35s cubic-bezier(.23,1,.32,1)}
  .sheet .hero svg.trocando,.sheet .hero img.trocando{opacity:0}
  .sheet .hero.zoom-ativo .photo{transform:scale(2.2);cursor:grab;transition:transform .3s ease}
  .sheet .hero.zoom-ativo .photo.arrastando{cursor:grabbing;transition:none}
  .sheet .hero::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(180deg,transparent,var(--ink-2));pointer-events:none;z-index:1}
  .round{
    position:absolute;top:14px;width:40px;height:40px;border-radius:50%;z-index:3;
    display:grid;place-items:center;background:rgba(9,9,10,.65);backdrop-filter:blur(6px);border:1px solid var(--line);
  }
  .round.close{left:14px}.round.fav{right:14px}
  .round svg{width:18px;height:18px;fill:none;stroke:var(--gold-hi);stroke-width:1.8;stroke-linecap:round}
  .round.fav.on svg{fill:var(--gold);stroke:var(--gold)}
  .round:hover{background:rgba(9,9,10,.85);border-color:var(--gold)}

  .hero .nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:40px;height:40px;border-radius:50%;
    background:rgba(9,9,10,.65);backdrop-filter:blur(6px);border:1px solid var(--line);
    color:var(--gold-hi);font:300 22px/1 var(--sans);display:grid;place-items:center;padding:0;
  }
  .hero .nav-btn.prev{left:14px}
  .hero .nav-btn.next{right:14px}
  .hero .nav-btn:hover{background:var(--gold);color:#1a1307}

  .body{padding:4px 24px calc(var(--safe-b) + 28px)}
  .body h2{font:600 30px/1.15 var(--serif)}
  .tone{margin-top:6px;color:var(--gold);font-size:14px;font-weight:500}
  .body h3{margin:24px 0 8px;font:600 18px var(--serif)}
  .body p{color:#cfc8b9;max-width:62ch}
  .body ol{padding-left:0;list-style:none;counter-reset:s;display:grid;gap:10px}
  .body li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;color:#cfc8b9}
  .body li::before{
    content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--gold);color:var(--gold-hi);font:600 13px var(--sans);margin-top:1px;
  }
  .cta{
    margin-top:28px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:15px 20px;border-radius:999px;text-decoration:none;font-weight:600;color:#1a1307;
    background:linear-gradient(180deg,#f3dba0,#c9994a 60%,#b0802f);
    box-shadow:0 0 18px rgba(201,169,110,.45),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .cta:hover{filter:brightness(1.07)}
  .note{margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}

  .body .kit-box{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  .body .kit-box h3{margin-top:0}
  .body .kit-box h3::after{content:'';display:block;width:20px;height:1px;margin:10px 0 0;background:var(--line)}
  .kit-item{display:block;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(9,9,10,.6);text-decoration:none;transition:all .3s ease;margin-top:8px}
  .kit-item:hover{background:rgba(201,169,110,.08);border-color:var(--gold)}
  .kit-item .kit-nome{display:block;color:var(--gold-hi);font-size:13px;font-weight:600;margin-bottom:3px}
  .kit-item .kit-razao{display:block;color:var(--muted);font-size:12px;line-height:1.5}
  .kit-aviso{margin-top:12px;font-size:12px;color:var(--muted);text-align:center;opacity:.85}

  /* ---------- Aviso ---------- */
  .toast{
    position:fixed;left:50%;top:calc(var(--safe-t) + 16px);z-index:80;transform:translate(-50%,-140%);
    padding:11px 20px;border-radius:999px;background:var(--ink-3);border:1px solid var(--gold);
    color:var(--text);font-size:14px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
    box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .toast.show{transform:translate(-50%,0)}

  /* ---------- Loading ---------- */
  .loading-screen{position:fixed;inset:0;z-index:9999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s cubic-bezier(.4,0,.2,1),visibility 1s}
  .loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .loading-logo{display:flex;flex-direction:column;align-items:center;gap:12px}
  .loading-brand{font:600 3.6rem/1 var(--serif);color:var(--gold);letter-spacing:-.01em}
  .loading-sub{font:300 .68rem/1 var(--sans);letter-spacing:.5em;text-transform:uppercase;color:var(--muted);padding-left:.5em}
  .loading-bar{margin-top:36px;width:min(210px,64vw);height:2px;background:var(--line);border-radius:2px;overflow:hidden;transition:opacity .4s}
  .loading-bar-inner{width:0;height:100%;background:var(--gold-grad);transition:width .35s ease-out}
  .loading-percent{margin-top:14px;font-size:.62rem;color:var(--gold);opacity:.5;transition:opacity .4s;letter-spacing:.1em}

  .main-content{opacity:0;visibility:hidden;transform:translateY(15px);transition:all 1s cubic-bezier(.16,1,.3,1)}
  .main-content.visible{opacity:1;visibility:visible;transform:translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
  <div class="loading-logo">
    <span class="loading-brand">HairOS</span>
    <span class="loading-sub">Cortes + Kits</span>
  </div>
  <div class="loading-bar"><div class="loading-bar-inner" id="loadingBar"></div></div>
  <div class="loading-percent" id="loadingPercent">0%</div>
</div>

<div class="main-content" id="mainContent">
  <div class="wrap">
    <header>
      <div class="logo" role="img" aria-label="HairOS"><span>H</span></div>

</div>

</nav>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

     {nome:"Máscara Nutrioil — L'Oréal Expert", razao:"Nutre as camadas do bob sem perder o movimento", link:ML_LINKS.expert}
   ],
   imagens:{frente:"imagens/corte05-frente.png",lado:"imagens/corte05-lado.png",atras:"imagens/corte05-atras.png"},
   hair:["#d4a373","#5a3a20"], hi:"#f4d8ae", skin:"#f2d5c1", lip:"#c9786f", type:"bob", img:""},

  {id:"camadas-medias", cat:"Médios", nome:"Camadas Médias",
   resumo:"Corte médio em camadas com franja cortina e muito movimento. Versátil e elegante.",
   tone:"Médio · camadas · franja cortina",
   descricoes:{
     frente:"Camadas médias com franja cortina. A franja abre o rosto e as camadas criam movimento — equilibra rostos alongados ou ovais com elegância.",
     lado:"De perfil, as camadas longas e graduais dão forma e um caimento fluido, com pontas que se movimentam naturalmente.",
     atras:"Por trás, as camadas sobrepostas garantem volume e um caimento fluido, mantendo a elegância por todos os lados."
   },
   kit:[
     {nome:"Escova Térmica Evas — Ferramentas", razao:"Modela as camadas médias com movimento e brilho", link:ML_LINKS.ferramentas},
     {nome:"Condicionador Resistance — Kérastase", razao:"Desembaraça as camadas longas sem quebrar os fios", link:ML_LINKS.kerastase},
     {nome:"Shampoo Moisture Recovery — Joico", razao:"Hidrata da raiz às pontas para as camadas caírem fluido", link:ML_LINKS.joico}
   ],
   imagens:{frente:"imagens/corte06-frente.png",lado:"imagens/corte06-lado.png",atras:"imagens/corte06-atras.png"},
   hair:["#a07448","#3a2412"], hi:"#d4a878", skin:"#e4b590", lip:"#a85a53", type:"wavy", img:""},

  {id:"short-shag", cat:"Curtos", nome:"Short Shag",
   resumo:"Shag curto com franja desfiada e camadas texturizadas. Estilo despojado e atual.",
   tone:"Curto · shag · pontas desfiadas",
   descricoes:{
     frente:"Shag curto com franja desfiada e camadas texturizadas. Cria textura e volume — valoriza rostos finos ou delicados com atitude.",
     lado:"De lado, as camadas curtas e repicadas dão volume e movimento, com um ar despojado e autêntico.",
     atras:"Na nuca, camadas texturizadas e pontas desfiadas mantêm o estilo solto e cheio de personalidade."
   },
   kit:[
     {nome:"Máscara Intensa — Joico", razao:"Texturiza o shag curto e destaca as pontas desfiadas", link:ML_LINKS.joico},
     {nome:"Sérum Pro Longer — L'Oréal Expert", razao:"Dá brilho e controla o frizz das camadas curtas", link:ML_LINKS.expert},
     {nome:"Escova de Cerdas Naturais — Ferramentas", razao:"Finaliza o topo com volume natural e sem eletricidade", link:ML_LINKS.ferramentas}
   ],
   imagens:{frente:"imagens/corte07-frente.png",lado:"imagens/corte07-lado.png",atras:"imagens/corte07-atras.png"},
   hair:["#7a4a28","#1c1008"], hi:"#a8703c", skin:"#edc19c", lip:"#c06b60", type:"bob", img:""}
];

const ORDEM_ANGULOS = ['frente','lado','atras'];
const ANGULOS = {frente:{label:'Frente'},lado:{label:'Lado'},atras:{label:'Atrás'}};
const FILTROS = ["Todos","Curtos","Médios","Longos"];

/* =========================================================
   RETRATOS ILUSTRADOS (fallback)
   ========================================================= */
function portrait(c, i){
  const g="hg"+i, bg="bg"+i; let back="", front="", hl="";
  if(c.type==="bob"){
    back=`<path d="M50 9C24 9 17 36 18 60L17 94Q50 100 83 94L82 60C83 36 76 9 50 9Z"/>`;
    front=`<path d="M23 50C24 24 40 15 52 15C66 15 77 26 77 50C70 38 60 27 44 27C34 29 27 38 23 50Z"/>`;
    hl=`<g fill="none" stroke="${c.hi}" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M24 40C20 58 22 74 21 90"/><path d="M78 40C80 58 78 74 79 90"/><path d="M40 18C52 14 66 18 72 28"/></g>`;
  }else{
    back=`<path d="M50 8C22 8 13 34 16 60C18 80 6 96 14 118L86 118C94 96 82 80 84 60C87 34 78 8 50 8Z"/>`;
    front=`<path d="M23 50C24 24 40 14 50 14C62 14 77 24 77 50C70 36 60 27 48 27C36 30 29 38 23 50Z"/>`;
    hl=`<g fill="none" stroke="${c.hi}" stroke-width="2.2" stroke-linecap="round" opacity=".6"><path d="M22 44C14 64 28 74 20 98"/><path d="M78 44C86 64 72 74 80 98"/><path d="M30 24C42 14 58 14 70 24"/></g>`;
  }
  return `<svg viewBox="0 0 100 112" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${c.nome}">
    <defs>
      <linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.hair[0]}"/><stop offset="1" stop-color="${c.hair[1]}"/></linearGradient>
      <radialGradient id="${bg}" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#f1e6d6"/><stop offset="1" stop-color="#b9a78f"/></radialGradient>
    </defs>
    <rect width="100" height="112" fill="url(#${bg})"/>
    <g fill="url(#${g})">${back}</g>
    <path d="M10 118C12 98 32 88 50 88C68 88 88 98 90 118Z" fill="#1d1d20"/>
    <rect x="43" y="70" width="14" height="20" rx="6" fill="${c.skin}"/>
    <rect x="43" y="70" width="14" height="8" fill="#000" opacity=".12"/>
    <ellipse cx="50" cy="52" rx="21" ry="26" fill="${c.skin}"/>
    <g fill="url(#${g})">${front}</g>${hl}
    <g fill="#2a1a14"><ellipse cx="41" cy="53" rx="2.3" ry="2.6"/><ellipse cx="59" cy="53" rx="2.3" ry="2.6"/></g>
    <g fill="#fff"><circle cx="41.8" cy="52.2" r=".8"/><circle cx="59.8" cy="52.2" r=".8"/></g>
    <g fill="none" stroke="${c.hair[1]}" stroke-width="1.6" stroke-linecap="round" opacity=".85"><path d="M36 46Q41 43.5 46 46"/><path d="M54 46Q59 43.5 64 46"/></g>
    <path d="M50 54Q48.5 61 50.5 62.5" fill="none" stroke="#000" stroke-width="1" opacity=".18" stroke-linecap="round"/>
    <path d="M41 65Q50 76 59 65Q50 68.5 41 65Z" fill="#fff" stroke="${c.lip}" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}

/* =========================================================
   ESTADO E FAVORITOS
   ========================================================= */
const KEY = "hairos_cortes_favoritos";
let favs = [];
try { favs = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) { favs = []; }
function saveFavs(){ try { localStorage.setItem(KEY, JSON.stringify(favs)); } catch(e) {} }

let filtro = "Todos";
let aba = "cortes";
let abertaId = null;
let anguloAtual = 0;
let lastFocus = null;
let zoomAtivo = false;
let panX = 0, panY = 0, panStartX = 0, panStartY = 0, panOrigX = 0, panOrigY = 0, arrastandoImg = false;
const ZOOM_SCALE = 2.2;

const $ = id => document.getElementById(id);
const grid = $("grid"), chipsEl = $("chips"), sheet = $("sheet"), veil = $("veil"), toastEl = $("toast");

/* ---------- Utilitários ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const k in (attrs||{})){
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}
let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
const heartSvg = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6.1 5c2.1 0 3.6 1.2 4.4 2.5h3C14.3 6.2 15.8 5 17.9 5c3.4 0 5.2 3.4 3.7 6.8C19.5 16.4 12 21 12 21z" stroke-linejoin="round"/></svg>';
const closeSvg = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function media(c, i, angulo){
  const box = el("span", {class:"photo"});
  const src = angulo ? c.imagens[angulo] : c.imagens.frente;
  if (c.img || src){
    const im = el("img", {src: src || c.img, alt:c.nome, loading:"lazy"});
    im.onerror = () => { box.innerHTML = portrait(c, i); };
    box.appendChild(im);
  } else {
    box.innerHTML = portrait(c, i);
  }
  return box;
}

/* ---------- Filtros ---------- */
function renderChips(){
  chipsEl.innerHTML = "";
  chipsEl.style.display = aba === "cortes" ? "flex" : "none";
  FILTROS.forEach(f => {
    const b = el("button", {class:"chip", "aria-pressed": String(f === filtro), text:f});
    b.onclick = () => { filtro = f; renderChips(); renderGrid(); };
    chipsEl.appendChild(b);
  });
}

/* ---------- Grade ---------- */
function renderGrid(){
  grid.innerHTML = "";
  let lista = CORTES.map((c, i) => ({c, i}));
  if (aba === "fav") lista = lista.filter(x => favs.includes(x.c.id));
  else if (filtro !== "Todos") lista = lista.filter(x => x.c.cat === filtro);

  if (!lista.length){
    grid.appendChild(el("div", {class:"empty"},
      el("b", {text: aba === "fav" ? "Nenhum corte guardado ainda" : "Nenhum corte nesta categoria"}),
      el("span", {text: aba === "fav" ? "Toque no coração de um corte para guardá-lo aqui." : "Escolha outra categoria no filtro acima."})
    ));
    return;
  }
  lista.forEach(({c, i}, pos) => {
    const card = el("button", {class:"card", "aria-label":c.nome + ". Ver detalhes"});
    card.style.setProperty("--i", pos);
    const ph = media(c, i, "frente");
    ph.appendChild(el("span", {class:"cap"}, c.nome, el("small", {text:c.tone})));
    const h = el("span", {class:"heart" + (favs.includes(c.id) ? " on" : ""), html:heartSvg, "aria-hidden":"true"});
    ph.appendChild(h);
    card.appendChild(ph);
    card.onclick = () => abrir(c.id);
    grid.appendChild(card);
  });
}

/* ---------- Favoritos ---------- */
function alternarFav(id){
  const nome = CORTES.find(c => c.id === id).nome;
  if (favs.includes(id)){ favs = favs.filter(x => x !== id); toast(nome + " removido dos favoritos"); }
  else { favs.push(id); toast(nome + " guardado nos favoritos"); }
  saveFavs(); atualizarAbaFav(); renderGrid();
  const fb = sheet.querySelector(".round.fav");
  if (fb){ fb.classList.toggle("on", favs.includes(id)); fb.setAttribute("aria-pressed", String(favs.includes(id))); }
}
function atualizarAbaFav(){
  $("tabFav").textContent = favs.length ? "Favoritos (" + favs.length + ")" : "Favoritos";
}

/* ---------- Painel de detalhe ---------- */
function abrir(id){
  const i = CORTES.findIndex(c => c.id === id), c = CORTES[i];
  abertaId = id; anguloAtual = 0; lastFocus = document.activeElement;
  resetZoom();
  sheet.innerHTML = "";

  const hero = el("div", {class:"hero"});
  hero.appendChild(media(c, i, "frente"));

  const close = el("button", {class:"round close", "aria-label":"Fechar", html:closeSvg});
  const fav = el("button", {class:"round fav" + (favs.includes(id) ? " on" : ""), "aria-label":"Guardar nos favoritos",
                            "aria-pressed":String(favs.includes(id)), html:heartSvg});
  const prev = el("button", {class:"nav-btn prev", "aria-label":"Ângulo anterior", html:"&#8249;"});
  const next = el("button", {class:"nav-btn next", "aria-label":"Próximo ângulo", html:"&#8250;"});

  close.onclick = fechar;
  fav.onclick = () => alternarFav(id);
  prev.onclick = (e) => { e.stopPropagation(); trocarAngulo(-1); };
  next.onclick = (e) => { e.stopPropagation(); trocarAngulo(1); };
  hero.append(close, fav, prev, next);
  hero.onclick = (e) => {
    // não dispara zoom se o clique foi em botão de navegação/fechar/favoritar
    if (e.target.closest(".round, .nav-btn")) return;
    toggleZoom();
  };

  const body = el("div", {class:"body"},
    el("h2", {id:"sTitle", text:c.nome}),
    el("p", {class:"tone", text:c.tone}),
    el("h3", {text:"Sobre o corte"}), el("p", {id:"sDesc", text:c.descricoes.frente}),
    el("h3", {text:"Kit para manter em casa"})
  );

  const kitBox = el("div", {class:"kit-box"});
  (c.kit || []).forEach(k => {
    const a = el("a", {class:"kit-item", href:k.link, target:"_blank", rel:"sponsored noopener noreferrer"});
    a.appendChild(el("span", {class:"kit-nome", text:k.nome}));
    if (k.razao) a.appendChild(el("span", {class:"kit-razao", text:k.razao}));
    kitBox.appendChild(a);
  });
  kitBox.appendChild(el("p", {class:"kit-aviso", text:"Links de afiliado: se você comprar por eles, posso receber uma comissão — sem custo extra para você."}));
  body.appendChild(kitBox);

  // CTA final — só aparece se existir kit
  const primeiroKit = (c.kit && c.kit[0] && c.kit[0].link) ? c.kit[0].link : null;
  if (primeiroKit){
    const cta = el("a", {class:"cta", href:primeiroKit, target:"_blank", rel:"sponsored noopener noreferrer", text:"Ver o kit no Mercado Livre"});
    body.appendChild(cta);
  }
  body.appendChild(el("p", {class:"note", text:"Salve este corte e mostre no salão. Depois mantenha o resultado em casa."}));

  sheet.append(hero, body);
  sheet.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add("open"); veil.classList.add("open"); close.focus(); });
  document.body.classList.add("lock");
  sheet.scrollTop = 0;
}
function fechar(){
  if (!abertaId) return;
  resetZoom();
  abertaId = null;
  sheet.classList.remove("open"); veil.classList.remove("open");
  document.body.classList.remove("lock");
  setTimeout(() => { if (!abertaId) sheet.hidden = true; }, 400);
  if (lastFocus) lastFocus.focus();
}
veil.onclick = fechar;

/* ---------- Troca de ângulo dentro do sheet ---------- */
function trocarAngulo(delta){
  const c = CORTES.find(x => x.id === abertaId);
  if (!c) return;
  resetZoom();
  anguloAtual = (anguloAtual + delta + ORDEM_ANGULOS.length) % ORDEM_ANGULOS.length;
  const angulo = ORDEM_ANGULOS[anguloAtual];
  const hero = sheet.querySelector(".hero");
  const photoBox = hero.querySelector(".photo");
  const imgEl = photoBox.querySelector("img");
  const novaSrc = c.imagens[angulo];

  const trocar = () => {
    if (imgEl){
      imgEl.src = novaSrc;
      imgEl.classList.remove("trocando");
    } else {
      photoBox.innerHTML = "";
      const novo = media(c, CORTES.findIndex(x => x.id === c.id), angulo);
      photoBox.replaceWith(novo);
    }
    const desc = sheet.querySelector("#sDesc");
    if (desc) desc.textContent = c.descricoes[angulo] || c.resumo;
  };

  if (imgEl){
    imgEl.classList.add("trocando");
    setTimeout(trocar, 160);
  } else {
    trocar();
  }
}

/* ---------- Zoom ---------- */
function toggleZoom(){
  if (!abertaId) return;
  const hero = sheet.querySelector(".hero");
  const photo = hero.querySelector(".photo");
  if (!photo) return;
  zoomAtivo = !zoomAtivo;
  hero.classList.toggle("zoom-ativo", zoomAtivo);
  if (zoomAtivo){
    panX = 0; panY = 0;
    photo.style.transform = `scale(${ZOOM_SCALE})`;
  } else {
    photo.style.transform = "";
    panX = 0; panY = 0;
  }
}
function resetZoom(){
  zoomAtivo = false;
  const hero = sheet.querySelector(".hero");
  if (!hero) return;
  hero.classList.remove("zoom-ativo");
  const photo = hero.querySelector(".photo");
  if (photo){ photo.classList.remove("arrastando"); photo.style.transform = ""; }
  panX = 0; panY = 0;
}
function startPan(e){
  if (!zoomAtivo) return;
  const hero = sheet.querySelector(".hero");
  const photo = hero.querySelector(".photo");
  if (!photo) return;
  arrastandoImg = true;
  const t = e.touches ? e.touches[0] : e;
  panStartX = t.clientX; panStartY = t.clientY;
  panOrigX = panX; panOrigY = panY;
  photo.classList.add("arrastando");
  photo.style.transition = "none";
  e.preventDefault();
}
function movePan(e){
  if (!arrastandoImg) return;
  const hero = sheet.querySelector(".hero");
  const photo = hero.querySelector(".photo");
  if (!photo) return;
  const t = e.touches ? e.touches[0] : e;
  panX = panOrigX + (t.clientX - panStartX);
  panY = panOrigY + (t.clientY - panStartY);
  photo.style.transform = `scale(${ZOOM_SCALE}) translate(${panX / ZOOM_SCALE}px, ${panY / ZOOM_SCALE}px)`;
  e.preventDefault();
}
function endPan(){
  if (!arrastandoImg) return;
  arrastandoImg = false;
  const photo = sheet.querySelector(".hero .photo");
  if (photo){ photo.classList.remove("arrastando"); photo.style.transition = "transform .3s ease"; }
}

sheet.addEventListener("mousedown", startPan);
sheet.addEventListener("touchstart", startPan, {passive:false});
window.addEventListener("mousemove", movePan);
window.addEventListener("touchmove", movePan, {passive:false});
window.addEventListener("mouseup", endPan);
window.addEventListener("touchend", endPan);
window.addEventListener("touchcancel", endPan);

/* ---------- Teclado ---------- */
addEventListener("keydown", e => {
  if (e.key === "Escape"){
    if (zoomAtivo){ resetZoom(); return; }
    fechar();
  }
  if (!abertaId) return;
  if (e.key === "ArrowLeft") trocarAngulo(-1);
  if (e.key === "ArrowRight") trocarAngulo(1);
  if (e.key === "Tab"){
    const f = sheet.querySelectorAll("button, a[href]");
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- Swipe no hero (mobile) ---------- */
let toqueX = null, toqueY = null;
sheet.addEventListener("touchstart", (e) => {
  if (zoomAtivo || arrastandoImg) return;
  if (!e.target.closest(".hero")) return;
  toqueX = e.touches[0].clientX;
  toqueY = e.touches[0].clientY;
}, {passive:true});
sheet.addEventListener("touchend", (e) => {
  if (zoomAtivo || toqueX === null) return;
  const dx = e.changedTouches[0].clientX - toqueX;
  const dy = e.changedTouches[0].clientY - toqueY;
  toqueX = null; toqueY = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2){
    trocarAngulo(dx < 0 ? 1 : -1);
  }
}, {passive:true});

/* ---------- Abas ---------- */
function trocarAba(a){
  aba = a;
  $("tabCortes").setAttribute("aria-pressed", String(a === "cortes"));
  $("tabFav").setAttribute("aria-pressed", String(a === "fav"));
  renderChips(); renderGrid();
  scrollTo({top:0, behavior:"smooth"});
}
$("tabCortes").onclick = () => trocarAba("cortes");
$("tabFav").onclick   = () => trocarAba("fav");

/* ---------- Barra flutuante ---------- */
const nav = $("nav"); let lastY = scrollY, ticking = false;
addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const y = scrollY;
    if (y > lastY + 6 && y > 140) nav.classList.add("hide");
    else if (y < lastY - 6) nav.classList.remove("hide");
    lastY = y; ticking = false;
  });
}, {passive:true});

/* ---------- Loading ---------- */
document.addEventListener("DOMContentLoaded", function(){
  const ls = $("loadingScreen"), lb = $("loadingBar"), lp = $("loadingPercent"), mc = $("mainContent");
  const primeiras = CORTES.slice(0, 6).map(c => c.imagens.frente);
  let prontas = 0, tempoMinimo = false, terminou = false;
  function atualizar(){
    const pct = Math.round((prontas / primeiras.length) * 100);
    lb.style.width = pct + "%"; lp.textContent = pct + "%";
    if (prontas >= primeiras.length && tempoMinimo) finish();
  }
  function finish(){
    if (terminou) return; terminou = true;
    lb.style.width = "100%"; lp.textContent = "100%";
    setTimeout(() => { ls.classList.add("hidden"); mc.classList.add("visible"); }, 600);
  }
  primeiras.forEach(src => {
    const im = new Image();
    const ok = () => { prontas++; atualizar(); };
    im.onload = ok; im.onerror = ok; im.src = src;
  });
  setTimeout(() => { tempoMinimo = true; atualizar(); }, 1000);
  setTimeout(finish, 3500);
});

/* ---------- Início ---------- */
atualizarAbaFav(); renderChips(); renderGrid();
</script>
</body>
</html>
